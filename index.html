<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲームコレクション</title>
    <style>
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            background-color: #0f0f1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #ffe66d;
            margin-bottom: 30px;
            text-align: center;
        }

        #game-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .game-card {
            background: #162447;
            border: 2px solid #4ecdc4;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s, border-color 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #ffe66d;
        }

        .game-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .game-desc {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 16px;
            flex-grow: 1;
        }

        .btn-play {
            background: #ff6b6b;
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-play:hover {
            background: #ff4757;
        }
    </style>
</head>
<body>

    <h1>🎮 楽しく遊んで学べるゲーム集</h1>

    <div id="game-list">
        <!-- JavaScriptで自動的にゲームのボタンが生成されます -->
    </div>

    <script src="index.js"></script>
</body>
</html>
