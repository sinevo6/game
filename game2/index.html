<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>戦国合戦無双 - ステータス＆自律軍勢版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- モード選択モーダル -->
    <div id="start-modal" class="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md">
        <div class="hud-panel p-8 rounded-2xl text-center shadow-2xl max-w-md w-full border border-red-600/60 m-4">
            <h1 class="text-2xl font-bold text-red-500 mb-2">⚔️ 戦国合戦無双 ⚔️</h1>
            <p id="modal-desc" class="text-sm text-gray-300 mb-6">討ち取る敵軍の規模を選択せよ！<br><span class="text-amber-400 text-xs">（主人公 Lv.100 で出陣）</span></p>
            <div id="mode-buttons" class="grid grid-cols-2 gap-4">
                <button onclick="startGame(100)" class="btn-mode bg-red-950 hover:bg-red-800 border border-red-600 text-white py-3 px-4 rounded-xl font-bold">100 人<br><span class="text-xs text-gray-400">前哨戦</span></button>
                <button onclick="startGame(1000)" class="btn-mode bg-red-950 hover:bg-red-800 border border-red-600 text-white py-3 px-4 rounded-xl font-bold">1,000 人<br><span class="text-xs text-gray-400">大部隊戦</span></button>
                <button onclick="startGame(10000)" class="btn-mode bg-red-900 hover:bg-red-700 border border-red-500 text-white py-3 px-4 rounded-xl font-bold">10,000 人<br><span class="text-xs text-amber-300">大規模合戦</span></button>
                <button onclick="startGame(100000)" class="btn-mode bg-amber-950 hover:bg-amber-800 border border-amber-500 text-amber-300 py-3 px-4 rounded-xl font-bold">100,000 人<br><span class="text-xs text-amber-400">天下分け目</span></button>
            </div>
            <div id="clear-actions" class="hidden mt-6">
                <button onclick="returnToStageSelect()" class="btn-mode bg-red-800 hover:bg-red-700 border border-red-500 text-white py-3 px-6 rounded-xl font-bold text-base shadow-lg">ステージ選択に戻る</button>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div class="absolute top-4 left-4 z-10 flex flex-col gap-3 pointer-events-none">
        <div class="hud-panel p-4 rounded-xl text-white shadow-2xl w-72 sm:w-80 pointer-events-auto">
            <h1 class="font-bold text-base sm:text-lg text-red-500 flex items-center justify-between">
                <span>⚔️ 血戦無双</span>
                <span class="text-xs bg-amber-600 px-2 py-0.5 rounded text-white font-mono">Lv.100 主人公</span>
            </h1>
            <div class="mt-3 flex justify-between items-center text-sm border-t border-gray-800 pt-2">
                <span class="text-gray-300">主人公 HP:</span>
                <span id="player-hp-val" class="font-mono text-base font-bold text-green-400">2000 / 2000</span>
            </div>
            <div class="mt-1 flex justify-between items-center text-sm">
                <span class="text-gray-300">主人公 スタミナ:</span>
                <span id="player-stamina-val" class="font-mono text-base font-bold text-cyan-400">500 / 500</span>
            </div>
            <div class="mt-1 flex justify-between items-center text-sm">
                <span class="text-gray-300">残り敵兵数:</span>
                <span id="enemy-count-val" class="font-mono text-xl font-bold text-red-400">1000</span>
            </div>
            <div class="mt-1 flex justify-between items-center text-sm">
                <span class="text-gray-300">味方残り兵数:</span>
                <span id="ally-count-val" class="font-mono text-lg font-bold text-blue-400">100</span>
            </div>
            <div class="mt-1 flex justify-between items-center text-sm">
                <span class="text-gray-300">撃破数:</span>
                <span id="score-val" class="font-mono text-lg font-bold text-amber-400">0</span>
            </div>
            <div id="combo-display" class="mt-2 text-xs text-amber-300 font-mono">
                コンボ: 待機中
            </div>
            <div id="status-msg" class="mt-2 text-xs text-green-400 bg-green-950/40 p-2 rounded border border-green-900/50">
                ✅ 合戦開始！味方が自律戦闘を開始！
            </div>
        </div>
    </div>

    <!-- 突撃指示オーバーレイUI -->
    <div id="tactical-overlay" class="hidden">
        <div class="bg-blue-950/90 border-2 border-cyan-400 text-cyan-200 px-6 py-3 rounded-full text-sm font-bold shadow-2xl animate-pulse text-center">
            🚩 突撃目標地点を指定せよ！（地面をタップ／クリック）
        </div>
    </div>

    <!-- アナログジョイスティック（左側: 移動） -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <!-- アクション＆戦術コマンドボタン（右側） -->
    <div class="absolute bottom-8 right-8 z-20 flex flex-col gap-3 select-none items-end">
        <div>
            <button id="btn-cmd-return" class="px-3 py-2 rounded-xl bg-slate-800/80 border border-slate-500 text-slate-200 font-bold text-xs shadow-lg active:scale-95">
                🔄 陣形復帰
            </button>
        </div>

        <div class="flex gap-3 items-end">
            <!-- 突撃指示ボタン -->
            <button id="btn-charge" class="w-16 h-16 rounded-full bg-blue-900/90 border-2 border-cyan-400 text-cyan-200 font-bold text-xs shadow-2xl active:bg-blue-700 active:scale-95 transition-all flex flex-col items-center justify-center">
                <span class="text-lg">🚩</span>
                <span class="text-[10px]">突撃指示</span>
            </button>

            <!-- プレイヤーの斬撃ボタン -->
            <button id="btn-attack" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-red-900/90 border-4 border-red-600 text-white font-bold text-lg shadow-2xl active:bg-red-700 active:scale-95 transition-all flex flex-col items-center justify-center">
                <span class="text-2xl">⚔️</span>
                <span class="text-xs mt-1">斬撃</span>
            </button>
        </div>
    </div>

    <!-- PC操作ガイド -->
    <div class="absolute top-4 right-4 z-10 hud-panel p-4 rounded-xl text-white shadow-2xl text-xs space-y-2 hidden lg:block w-72 pointer-events-none">
        <div class="font-bold text-red-400 mb-1 flex items-center gap-1"><span>⌨️</span> 操作方法 (PC)</div>
        <div class="flex justify-between items-center py-1 border-b border-gray-800">
            <span class="text-gray-300">移動</span>
            <span class="bg-gray-800 px-2 py-0.5 rounded font-mono text-red-300 border border-gray-700">矢印キー / WASD</span>
        </div>
        <div class="flex justify-between items-center py-1 border-b border-gray-800">
            <span class="text-gray-300">連続斬撃</span>
            <span class="bg-gray-800 px-2 py-0.5 rounded font-mono text-red-300 border border-gray-700">スペース / クリック</span>
        </div>
        <div class="flex justify-between items-center py-1">
            <span class="text-gray-300">全軍突撃モード</span>
            <span class="bg-gray-800 px-2 py-0.5 rounded font-mono text-cyan-300 border border-gray-700">Shift / Q キー</span>
        </div>
    </div>

    <!-- ES Modules 形式でメインスクリプトをロード -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
